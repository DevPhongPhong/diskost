[package]
name = "diskost-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Diskost meeting app for Windows, macOS, and Linux"

[[bin]]
name = "diskost-desktop"
path = "src/main.rs"

[dependencies]
diskost-core = { path = "../diskost-core" }
diskost-media = { path = "../diskost-media" }
diskost-proto = { path = "../diskost-proto" }
diskost-stream = { path = "../diskost-stream", features = ["capture"] }
# Native GPU UI: winit window + glow/OpenGL. No WebView, DOM, or HTML renderer.
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
