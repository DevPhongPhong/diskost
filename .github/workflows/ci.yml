name: ci

on:
  push:
  pull_request:

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build server/build --config Release
      - name: Test
        run: ctest --test-dir server/build -C Release --output-on-failure

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the Rust client except the native GUI
        working-directory: client
        run: cargo test --workspace --exclude diskost-desktop
